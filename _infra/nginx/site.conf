# =============================================================================
# PUBLIC — Port 80 (Tailscale IP / local network)
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ROOT → static files
    location = / {
        return 302 /outgoing/00-README.html;
    }

    # Upload server proxy
    location /upload/ {
        rewrite ^/upload/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location = /upload {
        return 302 /upload/;
    }

    # Static files
    location /outgoing/ {
        alias /root/outgoing/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "no-cache";
        types {
            text/html html htm;
            text/plain md txt;
            application/pdf pdf;
            application/octet-stream docx;
        }
    }

    location /dl/ {
        alias /root/outgoing/;
        add_header Content-Disposition 'attachment';
        types {
            text/plain md txt;
            application/pdf pdf;
            application/octet-stream docx;
        }
    }

    location /files {
        return 302 /outgoing/00-README.html;
    }

    # API → Task API :8000
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 0;
    }

    # Status dashboard
    location = /status {
        return 302 /outgoing/status.html;
    }
}

# =============================================================================
# TUNNEL GATEWAY — Port 8880 (Cloudflare Tunnel entry point)
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:8880;
    server_name _;

    # ---- Auth (всі protected routes) ----
    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ---- Upload server (main page) — NO AUTH ----
    location / {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # ---- ttyd (web terminal) ----
    location /terminal/ {
        rewrite ^/terminal/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # ---- Uptime Kuma (monitoring) — NO AUTH ----
    location /monitor/ {
        auth_basic off;
        rewrite ^/monitor/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    # ---- Dozzle (Docker logs) — NO AUTH ----
    location /logs/ {
        auth_basic off;
        rewrite ^/logs/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ---- Vaultwarden (passwords) ----
    location /vault/ {
        rewrite ^/vault/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 128m;
    }

    # ---- Upload (exact match) — NO AUTH ----
    location = /upload {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location /upload/ {
        auth_basic off;
        rewrite ^/upload/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
